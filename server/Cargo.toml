[package]
name = "sizematters-server"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
actix = "0.13"
actix-web = "4"
actix-web-actors = "4"
actix-rt = "2"
actix-files = "0.6"
env_logger = "0.11"
futures = "0.3"

uuid = { version = "1", features = ["v4"] }

md5 = "0.7.0"

regex = "1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rand = "0.9"

sizematters-shared = { path = "../shared", features = ["actix"] }
